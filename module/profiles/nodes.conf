# 运行时可写节点候选表
#
# 每行:  <键> path=<路径> on=<开启时写入的值> off=<关闭时写入的值>
# 同一个键可以有多行候选，obk 取第一个实际存在的路径。
# 内核版本之间节点命名可能不同，若开关无效请在此补充本机的实际路径，
# 无需重新编译。
#
# 用 obk batt proto <pps|ufcs|svooc> 读写，返回 unknown 表示没有命中候选。

proto_pps    path=/sys/class/oplus_chg/common/pps_disable        on=0 off=1
proto_pps    path=/sys/class/oplus_chg/common/cpa_pps_enable     on=1 off=0
proto_pps    path=/sys/class/oplus_chg/common/pps_support        on=1 off=0
# Android 16 / oplus_chg_v2 的 /proc/oplus-votable 接口
# 需配合 service.sh 在开机时把 force_active 置 1，开关写入 force_val 即生效
proto_pps    path=/proc/oplus-votable/PPS_DISABLE/force_val      on=0 off=1
proto_pps    path=/sys/class/oplus_chg/battery/pps_disable       on=0 off=1

proto_ufcs   path=/sys/class/oplus_chg/common/ufcs_disable       on=0 off=1
proto_ufcs   path=/sys/class/oplus_chg/common/cpa_ufcs_enable    on=1 off=0
proto_ufcs   path=/sys/class/oplus_chg/common/ufcs_support       on=1 off=0
proto_ufcs   path=/proc/oplus-votable/UFCS_DISABLE/force_val     on=0 off=1
proto_ufcs   path=/sys/class/oplus_chg/battery/ufcs_disable      on=0 off=1

proto_svooc  path=/sys/class/oplus_chg/common/svooc_disable      on=0 off=1
proto_svooc  path=/sys/class/oplus_chg/common/cpa_svooc_enable   on=1 off=0
proto_svooc  path=/sys/class/oplus_chg/common/vooc_disable       on=0 off=1
proto_svooc  path=/proc/oplus-votable/VOOC_DISABLE/force_val     on=0 off=1
proto_svooc  path=/sys/class/oplus_chg/battery/voocchg_ing       on=1 off=0

# 协议认证载荷
# obk batt auth <ufcs|sec> 会向 /dev/ufcs_dev 或 /dev/sec_dev 下发一段认证数据，
# 载荷取自本目录下的 auth_ufcs.bin / auth_sec.bin，开机由 service.sh 自动下发。
#
# auth_ufcs.bin  16 字节，ioctl 0x40016601 -> /dev/ufcs_dev，随包提供。
#                作用推断为 UFCS 协商高功率档前的认证数据，写入后驱动返回成功。
#                与 dtbo 功率表是两回事：表决定内核愿意跑多大电流，
#                这一步决定协议层面能否谈到那一档。
#                开机自动下发，obk cfg set auth_ufcs=0 可停用。
#
# 载荷不存在时该步骤自动跳过，不影响其余功能。
